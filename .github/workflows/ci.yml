name: Cross-platform CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.13.0'
          enable-cache: false

      - name: Synchronize Python environment
        run: uv sync --locked --managed-python

      - name: Run Python tests
        run: uv run --locked python -B -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate product catalogue
        run: uv run --locked python -B tools/validate_products.py --strict-v1

      - name: Check knowledge consistency
        run: uv run --locked python -B tools/build_knowledge.py --check knowledge/MyTech_Product_Knowledge_v1.md

      - name: Check v2.1 local and AIEP TEST catalogue synchronization (read-only)
        run: uv run --locked python -B tools/check_catalogue_consistency.py

      - name: Check deferred prompt fixtures (read-only; not authoritative)
        run: uv run --locked python -B tools/build_prompt_ab_test.py --check

      - name: Check actual-export GLM-4.7 six-request preparation (read-only)
        run: uv run --locked python -B tools/build_glm47_prompt_ab.py --check

      - name: Check actual workflow registry and release snapshots (read-only)
        run: uv run --locked python -B tools/check_workflow_registry.py

      - name: Run Node.js tests
        run: node --test tests/*.test.mjs

      - name: Check isolated Original usage-repair candidate (read-only)
        run: uv run --locked python -B tools/build_v21_usage_repair.py --check

      - name: Check isolated completion-repair candidate (read-only)
        run: uv run --locked python -B tools/build_v21_completion_repair.py --check

      - name: Replay PR17 regressions against the completion candidate
        env:
          MYTECH_REPAIR_PACKAGE: v21_completion_fix
        run: node --test tests/usage-repair.test.mjs

      - name: Check isolated quick prompt demo candidate (read-only)
        run: uv run --locked python -B tools/build_v21_quick_prompt_demo.py --check

      - name: Replay PR17 regressions against the quick prompt demo
        env:
          MYTECH_REPAIR_PACKAGE: v21_quick_prompt_demo
        run: node --test tests/usage-repair.test.mjs

      - name: Replay PR18 regressions against the quick prompt demo
        env:
          MYTECH_COMPLETION_PACKAGE: v21_quick_prompt_demo
        run: node --test tests/completion-repair.test.mjs
