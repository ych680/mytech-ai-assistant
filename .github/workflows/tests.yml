name: Response tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check syntax
        run: |
          node --check mytech_v2_server.mjs
          node --check mytech_response.mjs

      - name: Run response tests
        run: node --test tests/response.test.mjs
