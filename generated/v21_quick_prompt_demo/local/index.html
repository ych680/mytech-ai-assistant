<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="MyTech v2 — a FastGPT-powered electronic product recommendation chatbot using validated reference product data.">
  <title>MyTech v2.1 TEST — Product Candidates</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f6f3;
      --surface: #ffffff;
      --surface-soft: #f2f1ee;
      --surface-raised: #f2f1ee;
      --border: #dedcd7;
      --border-strong: #c9c6c0;
      --text: #1c1c1c;
      --text-soft: #6f6d69;
      --text-muted: #726f6a;
      --green: #21b66f;
      --shadow: 0 8px 28px rgba(20, 20, 20, 0.035);
      --header-height: 82px;
      --composer-height: 212px;
      --radius-xl: 20px;
      --radius-lg: 16px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    body::before {
      display: none;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(31, 31, 31, 0.55);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .topbar {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      height: var(--header-height);
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.97);
    }

    .topbar-inner {
      width: min(100% - 32px, 1120px);
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .topbar-left,
    .topbar-right,
    .identity-list,
    .status {
      display: flex;
      align-items: center;
    }

    .topbar-left {
      min-width: 0;
      gap: 18px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid #111111;
      border-radius: 12px;
      background: #1f1f1f;
      box-shadow: 0 2px 8px rgba(20, 20, 20, 0.12);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .identity-list {
      min-width: 0;
      gap: 24px;
    }

    .identity-item {
      min-width: 0;
    }

    .identity-key,
    .identity-value {
      display: block;
      white-space: nowrap;
    }

    .identity-key {
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .identity-value {
      margin-top: 1px;
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .topbar-right {
      flex: 0 0 auto;
      gap: 14px;
    }

    .status {
      gap: 9px;
      color: var(--text-soft);
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(33, 182, 111, 0.1);
    }

    .status.is-generating .status-dot {
      background: #6f6d69;
      box-shadow: 0 0 0 3px rgba(111, 109, 105, 0.12);
      animation: status-pulse 1s ease-in-out infinite;
    }

    .status.is-unavailable .status-dot {
      background: #8e8a84;
      box-shadow: 0 0 0 3px rgba(142, 138, 132, 0.12);
    }

    .restart-button {
      min-height: 40px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
      color: #292929;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .restart-button:hover {
      border-color: var(--border-strong);
      background: #f2f1ee;
      transform: translateY(-1px);
    }

    .chat-card {
      position: fixed;
      top: calc(var(--header-height) + 16px);
      bottom: calc(var(--composer-height) + 14px);
      left: 50%;
      width: min(calc(100% - 32px), 980px);
      transform: translateX(-50%);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .chat-card::before {
      display: none;
    }

    .messages {
      height: 100%;
      overflow-y: auto;
      padding: 30px clamp(18px, 4vw, 42px) 38px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #c9c6c0 transparent;
    }

    .messages::-webkit-scrollbar {
      width: 8px;
    }

    .messages::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: #c9c6c0;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      margin: 0 0 24px;
      animation: message-in 220ms ease both;
    }

    .message.user {
      justify-content: flex-end;
    }

    .assistant-avatar {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      margin-top: 22px;
      border: 1px solid #111111;
      border-radius: 10px;
      background: #1f1f1f;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      box-shadow: 0 2px 7px rgba(20, 20, 20, 0.1);
    }

    .message-stack {
      min-width: 0;
      max-width: min(82%, 720px);
    }

    .user .message-stack {
      max-width: min(72%, 640px);
    }

    .assistant-label {
      margin: 0 0 6px 3px;
      color: #292929;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .bubble {
      border: 1px solid #ebe9e5;
      border-radius: var(--radius-lg);
      background: var(--surface-raised);
      color: var(--text);
      font-size: 1rem;
      line-height: 1.58;
      padding: 14px 17px;
      box-shadow: none;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      border-color: #262626;
      border-radius: var(--radius-lg);
      background: #262626;
      color: #ffffff;
      box-shadow: none;
    }

    .bubble p {
      margin: 0;
    }

    .bubble p + p {
      margin-top: 10px;
    }

    .support-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 12px 0 2px;
      padding: 0;
      list-style: none;
    }

    .support-list li {
      padding: 5px 9px;
      border: 1px solid #d8d6d1;
      border-radius: 10px;
      background: #ffffff;
      color: #474541;
      font-family: inherit;
      font-size: 0.78rem;
    }

    .thinking-bubble {
      min-width: 142px;
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--text-soft);
    }

    .thinking-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 20px;
    }

    .thinking-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6f6d69;
      animation: dot-bounce 900ms ease-in-out infinite;
    }

    .thinking-dots span:nth-child(2) {
      animation-delay: 130ms;
    }

    .thinking-dots span:nth-child(3) {
      animation-delay: 260ms;
    }

    .recommendation-intro {
      margin-bottom: 12px !important;
    }

    .product-list {
      display: grid;
      gap: 10px;
    }

    .product-card {
      padding: 13px;
      border: 1px solid #d8d6d1;
      border-radius: var(--radius-md);
      background: #ffffff;
    }

    .product-topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .product-name {
      color: #1c1c1c;
      font-weight: 600;
      line-height: 1.35;
    }

    .product-price {
      color: #1f1f1f;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .product-meta {
      margin-top: 5px;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .product-specs {
      margin: 9px 0 0;
      color: #54514c;
      font-family: inherit;
      font-size: 0.78rem;
      line-height: 1.55;
    }

    .product-reason {
      margin-top: 8px !important;
      color: #333230;
      font-size: 0.88rem;
      line-height: 1.52;
    }

    .product-source {
      margin-top: 8px !important;
      color: #77736d;
      font-size: 0.76rem;
      line-height: 1.45;
    }

    .next-step {
      margin-top: 12px !important;
      color: #474541;
      font-size: 0.9rem;
    }

    .demo-note {
      margin-top: 12px !important;
      color: var(--text-muted);
      font-size: 0.76rem;
    }

    .composer-shell {
      position: fixed;
      inset: auto 0 0;
      z-index: 20;
      height: var(--composer-height);
      border-top: 1px solid var(--border);
      background: rgba(247, 246, 243, 0.98);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .composer-inner {
      width: min(calc(100% - 32px), 980px);
      height: 100%;
      margin: 0 auto;
      padding: 16px 0 13px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .quick-prompts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .prompt-button,
    .recovery-button {
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid #d8d6d1;
      border-radius: 999px;
      background: #ffffff;
      color: #292929;
      font-size: 0.77rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: color 150ms ease, border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .prompt-button:hover:not(:disabled),
    .recovery-button:hover:not(:disabled) {
      border-color: #aaa7a1;
      background: #f1f0ed;
      color: #1c1c1c;
      transform: translateY(-1px);
    }

    .recovery-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 7px;
      border: 1px solid #d7d5d0;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 4px 16px rgba(20, 20, 20, 0.035);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .composer-row:focus-within {
      border-color: #808080;
      box-shadow: 0 4px 16px rgba(20, 20, 20, 0.035), 0 0 0 3px rgba(31, 31, 31, 0.08);
    }

    #messageInput {
      width: 100%;
      min-height: 46px;
      max-height: 132px;
      resize: none;
      overflow-y: hidden;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 11px 10px;
      font-size: 1rem;
      line-height: 1.5;
    }

    #messageInput::placeholder {
      color: #77736d;
    }

    .send-button {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 12px;
      background: #1f1f1f;
      color: #ffffff;
      box-shadow: none;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease, opacity 150ms ease;
    }

    .send-button:hover:not(:disabled) {
      background: #000000;
      transform: translateY(-1px);
    }

    .send-button svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    textarea:disabled,
    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .composer-help {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: var(--text-muted);
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .mock-label {
      color: var(--text-soft);
    }

    @keyframes message-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes dot-bounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.48;
      }
      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    @keyframes status-pulse {
      0%, 100% {
        opacity: 0.46;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1.08);
      }
    }

    @media (max-width: 760px) {
      :root {
        --composer-height: 174px;
      }

      .quick-prompts {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding: 1px 1px 5px;
        scrollbar-width: none;
      }

      .quick-prompts::-webkit-scrollbar {
        display: none;
      }
    }

    @media (max-width: 700px) {
      :root {
        --header-height: 116px;
        --composer-height: 174px;
      }

      .topbar-inner {
        width: min(100% - 24px, 980px);
        padding: 9px 0;
        align-content: center;
        flex-wrap: wrap;
        gap: 7px 12px;
      }

      .topbar-left,
      .topbar-right {
        width: 100%;
        justify-content: space-between;
      }

      .topbar-left {
        gap: 12px;
      }

      .identity-list {
        width: 100%;
        justify-content: space-between;
        gap: 12px;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 11px;
        font-size: 0.78rem;
      }

      .identity-key {
        font-size: 0.63rem;
      }

      .identity-value {
        font-size: 0.79rem;
      }

      .status {
        font-size: 0.76rem;
      }

      .restart-button {
        min-height: 34px;
        padding: 6px 10px;
        font-size: 0.73rem;
      }

      .chat-card {
        top: calc(var(--header-height) + 8px);
        bottom: calc(var(--composer-height) + 8px);
        width: calc(100% - 20px);
        border-radius: 18px;
      }

      .messages {
        padding: 22px 14px 28px;
      }

      .message {
        gap: 8px;
        margin-bottom: 20px;
      }

      .assistant-avatar {
        width: 31px;
        height: 31px;
        margin-top: 21px;
        border-radius: 9px;
        font-size: 0.65rem;
      }

      .message-stack,
      .user .message-stack {
        max-width: calc(100% - 39px);
      }

      .bubble {
        padding: 12px 14px;
        font-size: 0.94rem;
      }

      .product-topline {
        gap: 9px;
      }

      .composer-inner {
        width: calc(100% - 20px);
        padding: 10px 0 9px;
        gap: 8px;
      }

      .quick-prompts {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding: 1px 1px 5px;
        scrollbar-width: none;
      }

      .quick-prompts::-webkit-scrollbar {
        display: none;
      }

      .prompt-button {
        min-height: 32px;
        font-size: 0.72rem;
      }

      .composer-row {
        border-radius: 15px;
        padding: 5px;
      }

      #messageInput {
        min-height: 44px;
        padding: 10px 8px;
        font-size: 0.95rem;
      }

      .send-button {
        width: 44px;
        height: 44px;
        border-radius: 12px;
      }

      .composer-help span:first-child {
        display: none;
      }

      .composer-help {
        justify-content: flex-end;
        font-size: 0.68rem;
      }
    }

    @media (max-width: 390px) {
      .identity-list {
        gap: 8px;
      }

      .identity-value {
        font-size: 0.73rem;
      }

      .restart-button {
        max-width: 170px;
        line-height: 1.2;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <style>
    [hidden] { display: none !important; }
    .chat-card { display: flex; flex-direction: column; }
    .messages { flex: 1; min-height: 0; height: auto; }
    .key-panel { flex: 0 0 auto; max-height: 45%; overflow-y: auto; padding: 12px 18px; border-bottom: 1px solid var(--border); }
    .key-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .key-panel input[type="password"] { flex: 1; min-width: 130px; width: 100%; padding: 9px; border: 1px solid var(--border); border-radius: 10px; font: inherit; }
    .key-panel input:focus-visible { outline: 3px solid rgba(31,31,31,.55); outline-offset: 2px; }
    .key-panel p { margin: 6px 0 0; font-size: .78rem; color: var(--text-soft); }
    .key-panel label { font-size: .78rem; }
  </style>
  <style data-quick-prompt-demo>
    /* Candidate-only additions live in the scrolling conversation, never the fixed composer. */
    .demo-examples,
    .demo-followup {
      margin: 0 0 18px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      color: var(--text-muted);
      font-size: .8rem;
      overflow-wrap: anywhere;
    }
    .demo-examples summary { cursor: pointer; color: var(--text); }
    .demo-examples p,
    .demo-followup p { margin: 8px 0; }
    .demo-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .demo-category { display: block; margin-bottom: 8px; }
    .demo-category select {
      display: block;
      width: 100%;
      max-width: 320px;
      min-height: 36px;
      margin-top: 6px;
      padding: 6px 8px;
      font: inherit;
      color: var(--text);
      border: 1px solid #d8d6d1;
      border-radius: 8px;
      background: #fff;
    }
    .demo-actions button { white-space: normal; max-width: 100%; }
    .demo-actions button:disabled { opacity: .5; cursor: default; }
    .demo-examples summary:focus-visible,
    .demo-category select:focus-visible { outline: 3px solid rgba(31,31,31,.55); outline-offset: 2px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <div class="brand-mark" aria-hidden="true">MT</div>
        <div class="identity-list" aria-label="Account and assistant information">
          <div class="identity-item">
            <span class="identity-key">User</span>
            <span class="identity-value">Guest Shopper</span>
          </div>
          <div class="identity-item">
            <span class="identity-key">Assistant</span>
            <span class="identity-value">MyTech</span>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="status" id="sessionStatus" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText">Loading reference data...</span>
        </div>
        <button class="restart-button" id="restartButton" type="button">Clear Conversation / Restart</button>
      </div>
    </div>
  </header>

  <main class="chat-card" aria-label="MyTech conversation">
    <section id="key-panel" class="key-panel" aria-label="FastGPT connection" hidden>
      <form id="key-form" class="key-form" autocomplete="off">
        <input id="key" type="password" placeholder="Your FastGPT application key" aria-label="FastGPT application key" spellcheck="false">
        <button class="restart-button" type="submit">Use key</button>
        <button class="restart-button" id="forget" type="button">Forget</button>
      </form>
      <p id="remember-row" hidden><label><input id="remember" type="checkbox"> Remember on this device</label></p>
      <p id="key-status" role="status" aria-live="polite">Enter your own FastGPT key. Requests use that key's application and budget.</p>
    </section>
    <div class="messages" id="messages" aria-live="polite" aria-relevant="additions text"></div>
  </main>

  <footer class="composer-shell">
    <div class="composer-inner">
      <div class="quick-prompts" aria-label="Starter questions">
        <button class="prompt-button" type="button" data-prompt="I need a laptop under ¥6,000 for gaming and a mouse under ¥300 for gaming.">Gaming Setup ×2</button>
        <button class="prompt-button" type="button" data-prompt="I need a laptop under ¥7,000 for study and office work.">Study Laptop</button>
        <button class="prompt-button" type="button" data-prompt="I need headphones under ¥1,200 for music, commuting, and noise cancellation.">ANC Headphones</button>
        <button class="prompt-button" type="button" data-prompt="I need a smartphone under ¥3,000 for gaming.">Gaming Smartphone</button>
      </div>

      <div class="composer-row">
        <label class="sr-only" for="messageInput">Message MyTech</label>
        <textarea id="messageInput" rows="1" placeholder="Describe the product, budget, or main usage…" aria-label="Message MyTech"></textarea>
        <button class="send-button" id="sendButton" type="button" aria-label="Send message">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22 2 11 13"></path>
            <path d="m22 2-7 20-4-9-9-4Z"></path>
          </svg>
        </button>

  <script type="application/json" id="mytech-reference-prompt">"You are MyTech, an electronic product recommendation chatbot.\n\nTARGET USER\nYou help general consumers who are not familiar with electronic product specifications and need simple purchase guidance.\n\nMAIN GOAL\nYour main job is to recommend suitable electronic products based mainly on the user's product category, budget, and main usage.\n\nINSTRUCTIONS\n1. Identify the user's product category, budget, and main usage before making a final recommendation.\n2. Once enough information is available, recommend a suitable product that matches the user's product category, budget, and main usage, and briefly explain why it is suitable.\n3. For follow-up requests, use the user's existing preferences and adjust the recommendation according to the new request instead of simply repeating the previous recommendation.\n4. If the user clearly starts a new recommendation request, start a new recommendation flow instead of automatically reusing previous preferences.\n5. When multiple suitable products are available, prioritize the option that best matches the user's main usage and budget instead of giving too many recommendations at once, unless the user explicitly asks for multiple alternatives.\n6. If the user clearly requests multiple supported products in the same message, treat each product request separately and provide a suitable recommendation for each one. Keep the category, budget, and main usage of each product request separate.\n\nTONE\nUse a clear, concise, friendly, and beginner-friendly tone.\nAvoid unnecessary technical jargon and explain technical terms simply when needed.\n\nCONSTRAINTS\n1. Use English only in all user-facing responses.\n2. Use RMB (¥) for all product prices and budgets.\n3. Treat the user's stated budget as a hard limit unless the user explicitly agrees to increase it. Do not present an over-budget product as a valid match.\n4. Only recommend products and product information that are included in the approved MyTech product dataset. Do not invent or fabricate product names, specifications, prices, availability, sources, or other product information.\n5. Treat prices in the MyTech product dataset as fixed reference prices for this classroom prototype. Do not claim that they are live retailer prices or invent current stock or availability.\n\nBOUNDARIES\n1. Only provide recommendations and guidance related to supported electronic product categories.\n2. The currently supported product categories are Laptop, Desktop, Smartphone, Tablet, Headphones, Monitor, Smartwatch, Mouse, and Keyboard.\n3. Do not provide advice on topics unrelated to electronic product selection.\n\nCLARIFICATION\n1. If product category, budget, or main usage is missing, ask one concise clarification question to collect the missing information before making a final recommendation.\n2. If the user's request contains an unclear preference such as \"better\", ask what aspect they want to improve instead of guessing.\n3. If it is unclear whether the user wants to continue the current recommendation or start a new one, ask for confirmation before reusing previous preferences.\n4. If one product request in a multi-product message is missing key information, ask only for the missing information for that specific request and preserve the information already provided for the other requests.\n\nFALLBACK\n1. If no available product matches the user's requirements, clearly explain that no suitable match is currently available and suggest a reasonable next step, such as adjusting the budget or requirements.\n2. If the user requests an unsupported product category, explain that the category is not currently supported and briefly list the supported categories.\n3. If the request is unrelated to electronic product selection, politely explain that it is outside MyTech's scope and redirect the user to supported electronic product recommendations.\n4. For a multi-product request, if one requested product cannot be matched but another can, return the valid recommendation or recommendations and clearly explain the unmatched request instead of failing the entire message.\n\nSTRUCTURED OUTPUT\nReturn only an object that follows the supplied JSON Schema. Always include answer, recommendations, next_step, and clarification_needed. Use an empty recommendations array when no product should be recommended. Use the exact dataset product name, category, numeric price, and source. Do not place product specifications in answer or next_step; the application renders specifications from the dataset after validation.\n\nCONTEXT RULES\nUse the supplied conversation history and session context. For \"cheaper\", \"more expensive\", or \"another option\", retain the relevant request details and do not repeat the previous product. A more expensive product must still stay within an active hard budget unless the user explicitly changes it. For \"better\", ask which aspect should improve and return no recommendation. A clear new request must not inherit stale category, budget, or usage details. Keep multiple request objects separate.\n"</script>
  <script>
    "use strict";
    const TEST_USAGE_POLICY = {"Gaming":["gaming"],"Study":["study","note-taking","reading"],"Office":["office","productivity","multitasking","home use"],"Creative":["creative","content creation","drawing"],"Photography":["photography"],"Media":["media","entertainment","video"],"Music":["music"],"Calls":["calls","voice chat"],"Travel":["travel","commute","portable"],"Fitness":["fitness","health tracking","daily health","running","training","outdoor sports"],"Development":["development"],"Productivity":["productivity","office","multitasking"],"Typing":["typing"],"Noise cancellation":["noise cancellation"],"Daily":["daily","general use","home use"]};
    const TEST_DEFAULT_TIMEOUT_MS = 120000;
// TEST-only deterministic policy. Product evidence always comes from the
// generated Master Dataset; aliases describe requests, never product facts.
function normalizeCatalogueUsage(value) {
  return value.normalize("NFKC").toLowerCase()
    .replace(/[\u2010-\u2015_-]/g, " ").replace(/[.,;!?()[\]"]/g, " ")
    .replace(/[&+/]/g, " and ").replace(/\s+/g, " ").trim();
}

function parseCatalogueUsage(requestedUsage, catalogue, compatibility, category) {
  if (typeof requestedUsage !== "string" || !requestedUsage.trim() || requestedUsage.length > 300) {
    return { valid: false, error: "A non-empty, supported main usage is required." };
  }
  const normalize = normalizeCatalogueUsage;
  const vocabulary = new Map();
  for (const entry of Object.values(catalogue)) {
    for (const tag of entry.main_usage) {
      vocabulary.set(normalize(tag), { tag: normalize(tag) });
    }
  }
  for (const group of Object.keys(compatibility)) {
    vocabulary.set(normalize(group), { group });
  }
  const aliases = {
    Gaming: ["game", "games", "play game", "play games", "playing games", "play a game", "playing a game", "video games", "videogames", "video gaming", "play video games", "playing video games", "playing computer games", "casual gaming"],
    Study: ["studying", "studies", "school", "schoolwork", "school work", "coursework", "homework", "student", "classes", "classwork", "taking notes", "take notes"],
    Office: ["work", "working", "office work", "office tasks", "business", "documents", "document editing", "spreadsheets"],
    Creative: ["design", "designing", "graphic design", "illustration", "video editing", "photo editing", "photo and video editing"],
    Photography: ["photo", "photos", "take photos", "taking photos", "photo taking", "take pictures", "taking pictures", "camera quality"],
    Media: ["movies", "videos", "watch movies", "watching movies", "watch videos", "watching videos", "video streaming", "streaming"],
    Music: ["listen to music", "listening to music", "listening", "audio", "songs", "podcasts"],
    Calls: ["call", "calling", "video calls", "voice calls"],
    Travel: ["travelling", "traveling", "commuting", "portable", "portability", "on the go"],
    Fitness: ["exercise", "exercising", "workout", "workouts", "working out", "daily health", "health monitoring"],
    Development: ["programming", "coding", "software development", "software programming", "software engineering"],
    Productivity: ["productive work", "multi tasking"],
    Typing: ["type documents"],
    "Noise cancellation": ["noise cancelling", "noise canceling", "active noise cancellation", "anc"],
    Daily: ["everyday", "everyday use", "basic use", "normal use", "casual use"]
  };
  for (const [group, phrases] of Object.entries(aliases)) {
    for (const phrase of phrases) {
      // Explicit dataset phrases take priority over aliases with broader meaning.
      if (!vocabulary.has(phrase)) vocabulary.set(phrase, { group });
    }
  }
  // Complete, category-scoped phrases: a qualitative Gaming preference, not
  // evidence of benchmarks. Never make 'good' or 'performance' filler words.
  if (category === "Laptop") {
    for (const phrase of ["gaming good performance", "gaming and good performance", "gaming with good performance", "good performance for gaming"]) {
      vocabulary.set(phrase, { tag: "gaming" });
    }
  }
  const phrases = [...vocabulary.keys()].sort((a, b) => b.split(" ").length - a.split(" ").length || b.length - a.length);
  const fillers = new Set(["i", "am", "would", "like", "want", "need", "looking", "it", "this", "device", "my", "mainly", "mostly", "primarily", "for", "to", "the", "a", "an", "and", "also", "use", "using", "with", "please", "only"]);
  const words = normalize(requestedUsage).split(" ");
  const requirements = [];
  for (let index = 0; index < words.length;) {
    const phrase = phrases.find(candidate => {
      const parts = candidate.split(" ");
      return parts.every((part, offset) => words[index + offset] === part);
    });
    if (phrase) {
      requirements.push(vocabulary.get(phrase));
      index += phrase.split(" ").length;
    } else if (fillers.has(words[index])) {
      index += 1;
    } else {
      // Includes unknown qualifiers, negation and ambiguous 'or' expressions.
      // A recognized substring must never hide unsupported request wording.
      return { valid: false, error: "Unrecognized or ambiguous main usage; please restate the intended use." };
    }
  }
  if (!requirements.length) return { valid: false, error: "A supported main usage is required." };
  return { valid: true, requirements };
}

function checkCatalogueUsage(product, requestedUsage, catalogue, compatibility) {
  const parsed = parseCatalogueUsage(requestedUsage, catalogue, compatibility, product.category);
  if (!parsed.valid) return parsed;
  const normalize = normalizeCatalogueUsage;
  const tags = product.main_usage.map(normalize);
  const supported = parsed.requirements.every(requirement => requirement.tag
    ? tags.includes(requirement.tag)
    : tags.some(tag => compatibility[requirement.group].some(term =>
      (" " + tag + " ").includes(" " + normalize(term) + " "))));
  return { valid: supported, error: supported ? "" : "The product's Master Dataset usage tags do not support the requested usage." };
}

// OFFLINE Phase 3 policy. Catalogue eligibility diagnoses omissions; it never
// manufactures recommendations or substitutes catalogue facts for retrieval.
function completionControlMessage(value) {
  const text = String(value || "").trim().replace(/[.!?]+$/, "");
  if (/^(?:hi|hello|hey)(?:\s+(?:hi|hello|hey|there|mytech))*$/i.test(text)) return true;
  const withoutGreeting = text.replace(/^(?:(?:hi|hello|hey)(?:\s+(?:there|mytech))?[,!]?\s+)+/i, "");
  // Whole capability questions only: no individual shopping category, budget,
  // usage qualifier or appended purchase clause is swallowed by this grammar.
  const capability = /^(?:(?:what|which) (?:(?:types|kinds) of )?(?:products|devices|electronics|electronic products|(?:product )?categories) (?:can|do|does) (?:you|mytech) (?:recommend|support)|what (?:can you|can mytech|do you|does mytech) (?:do|recommend|support|help(?: me)? with)|how can (?:you|mytech) help(?: me)?|(?:can|could) you help(?: me)?)$/i;
  if (capability.test(withoutGreeting)) return true;
  return /^(?:(?:hi|hello|hey)(?:\s+(?:hi|hello|hey|there|mytech))*|what (?:can you|can mytech|do you) (?:do|help(?: me)? with|recommend)|what (?:products|categories) (?:do you|does mytech) support|which (?:product )?categories can you recommend|(?:please )?(?:tell me a joke|write (?:me )?(?:an? |my )?essay|help me with my homework)|what(?:'s| is) the weather|(?:please )?(?:translate|quote|repair)\b.*)$/i.test(withoutGreeting)
    || /^(?:i (?:need|want)|(?:can you )?recommend)\s+(?:an?\s+)?(?:cameras?|printers?|televisions?|tvs?|routers?|speakers?|projectors?|consoles?)\b/i.test(withoutGreeting);
}

function completionNegativeClaim(answer, category) {
  // Each category must be the subject/object of its own affirmative negative
  // statement. A mention elsewhere in a clause is not a no-match explanation.
  // These words identify an intended negative result, not proof of its facts.
  // The catalogue calculation supplies that proof; canonical output replaces
  // all model prose on an accepted partial/empty no-match turn.
  const modifier = "(?:(?:valid|suitable|eligible|approved|cheaper|more affordable|less expensive|lower[- ]priced|more expensive|higher[- ]priced|alternative|different|another|other)\\s+)*";
  const subject = "(?:no\\s+" + modifier + category + "\\b|(?:i\\s+)?(?:could(?:n['’]t| not)|can(?:not|['’]t))\\s+find\\s+(?:(?:a|an|any)\\s+)?" + modifier + category + "\\b)";
  return String(answer || "").split(/(?:[.!?;\n](?!\d)|,?\s+(?:and|but)\s+|,\s*)/i)
    .some(clause => new RegExp("^\\s*" + subject + "[\\s\\S]*$", "i").test(clause));
}

function completionCanonicalNoMatch(output, omissions, intent) {
  const clauses = omissions.map(({ request, anchor }) => {
    const comparison = intent === "none" ? "" : intent === "alternative"
      ? "alternative " : intent === "cheaper" ? "cheaper " : "more expensive ";
    const relative = !anchor ? "" : intent === "alternative"
      ? " different from " + anchor.recommended_product
      : " than " + anchor.recommended_product + " (RMB " + anchor.price + ")";
    return "No " + comparison + request.category + " product" + relative + " in the MyTech test catalogue matches "
      + request.main_usage + " within RMB " + request.budget + ".";
  });
  return { ...output,
    answer: (output.recommendations.length ? "Reference recommendations are shown for the matching requests. " : "") + clauses.join(" "),
    next_step: "Would you like to change your requirements?", clarification_needed: false };
}

function completionHasRecord(evidence, product) {
  if (!Array.isArray(evidence)) return false;
  return evidence.some(chunk => {
    if (!chunk || typeof chunk !== "object") return false;
    // Structured offline records, or complete fields in a single RAG record.
    // Unknown/truncated chunk shapes remain insufficient evidence, never proof
    // of model failure. This recognizer is diagnostic only.
    if (chunk.product === product.product && chunk.category === product.category
      && (chunk.price_rmb ?? chunk.price) === (product.price_rmb ?? product.price)
      && chunk.source === product.source && Array.isArray(chunk.main_usage)
      && chunk.main_usage.length === product.main_usage.length
      && product.main_usage.every(tag => chunk.main_usage.includes(tag))) return true;
    const text = typeof chunk.a === "string" ? chunk.a : typeof chunk.content === "string" ? chunk.content : "";
    return text.split(/(?=^## Product Record:)/m).some(record => {
      const lines = record.split(/\r?\n/).map(line => line.trim());
      const uniqueFields = ["Product: ", "Category: ", "Reference Price: ", "Source: ", "Main Usage:"]
        .every(prefix => lines.filter(line => line.startsWith(prefix)).length === 1);
      const usageStart = lines.indexOf("Main Usage:") + 1;
      const usage = [];
      for (let i = usageStart; i < lines.length && lines[i].startsWith("- "); i++) usage.push(lines[i].slice(2));
      return uniqueFields && usage.length === product.main_usage.length
        && lines.includes("Product: " + product.product)
        && lines.includes("Category: " + product.category)
        && lines.includes("Reference Price: RMB " + (product.price_rmb ?? product.price))
        && lines.includes("Source: " + product.source)
        && product.main_usage.every(tag => usage.includes(tag));
    });
  });
}

function checkRecommendationCompletion(output, requests, catalogue, compatibility, options = {}) {
  const fail = (status, error) => ({ valid: false, status, error });
  if (!Array.isArray(output?.recommendations) || !Array.isArray(requests) || !requests.length) {
    return fail("invalid_completion_context", "A recommendation turn requires active requests and an array of recommendations.");
  }
  const products = Object.values(catalogue);
  const intent = options.intent || "none";
  if (!["none", "cheaper", "more_expensive", "alternative"].includes(intent)) return fail("invalid_completion_context", "Unknown comparison intent.");
  const returned = new Set(output.recommendations.map(item => item?.category));
  if (returned.size !== output.recommendations.length || [...returned].some(category => !requests.some(r => r?.category === category))) {
    return fail("invalid_completion_context", "Recommendations must have unique current-request categories.");
  }
  const seen = new Set();
  const omissions = [];
  for (const request of requests) {
    if (!request || !Number.isFinite(request.budget) || request.budget <= 0 || seen.has(request.category)
      || !products.some(p => p.category === request.category)) return fail("invalid_completion_context", "Each request needs a supported unique category and positive independent hard budget.");
    seen.add(request.category);
    const usage = parseCatalogueUsage(request.main_usage, catalogue, compatibility, request.category);
    if (!usage.valid) return fail("invalid_completion_context", usage.error);
    let anchor;
    if (intent !== "none") {
      const matches = (options.previous || []).filter(p => p?.category === request.category);
      anchor = matches.length === 1 ? matches[0] : null;
      const approved = products.find(p => p.product === anchor?.recommended_product && p.category === request.category);
      if (requests.length !== 1 || !approved || anchor.price !== (approved.price_rmb ?? approved.price)) {
        return fail("invalid_comparison_anchor", "A comparison requires one request and a unique validated same-category anchor.");
      }
    }
    if (returned.has(request.category)) continue;
    const eligible = products.filter(p => p.category === request.category && (p.price_rmb ?? p.price) <= request.budget
      && checkCatalogueUsage(p, request.main_usage, catalogue, compatibility).valid
      && (intent === "none" || (p.product !== anchor.recommended_product
        && (intent === "alternative" || (intent === "cheaper" ? (p.price_rmb ?? p.price) < anchor.price : (p.price_rmb ?? p.price) > anchor.price)))));
    omissions.push({ request, eligible, anchor });
  }
  if (!omissions.length) return { valid: true, status: output.recommendations.every(rec => {
    const product = products.find(p => p.product === rec.recommended_product);
    return product && completionHasRecord(options.evidence, product);
  }) ? "completed_with_recognized_evidence" : "completed_grounding_unverified" };
  const available = omissions.flatMap(item => item.eligible);
  if (available.length) {
    const evidence = options.evidence;
    const status = evidence === undefined ? "incomplete_or_evidence_uncertain"
      : Array.isArray(evidence) && !evidence.length ? "retrieval_evidence_empty"
      : available.some(p => completionHasRecord(evidence, p)) ? "incomplete_model_execution" : "retrieval_evidence_unverified";
    return fail(status, "An eligible catalogue request was omitted. This is not a verified catalogue no-match; no product was substituted.");
  }
  const deferred = /\b(?:(?:i|we) (?:will|shall)|i(?:'m| am) going to|we(?:'re| are) going to|let me|ready to|i now have all the information)\b[^.!?\n]*(?:recommend|find|suggest|information)/i.test([output.answer, output.next_step].join(" "))
    || /^(?:provide|generate|prepare|give)\b[^.!?\n]*\brecommendations?\b/i.test(output.next_step || "");
  if (deferred) return fail("incomplete_model_execution", "The response defers the current recommendation task.");
  for (const { request } of omissions) {
    const explained = completionNegativeClaim(output.answer, request.category);
    if (!explained) return fail("incomplete_model_execution", "Each omitted category needs an explicit verified no-match explanation.");
  }
  if (output.clarification_needed !== false) return fail("incomplete_model_execution", "A verified no-match is not a missing-information clarification.");
  return { valid: true, status: "verified_catalogue_no_match", output: completionCanonicalNoMatch(output, omissions, intent) };
}

// The browser has compact validated anchors and no retrieval trace. It can
// reject an unfulfilled request, but cannot diagnose the live retrieval cause.
function checkClientRecommendationCompletion(output, guard, catalogue, compatibility) {
  const categories = guard.targetCategories?.length ? guard.targetCategories : guard.activeCategories || [];
  const requests = categories.map(category => ({ category, budget: guard.budgetsByCategory?.[category], main_usage: guard.usagesByCategory?.[category] }));
  const control = guard.cancelled || guard.completionControl;
  const clarification = guard.ambiguousComparison || guard.ambiguousBetter || guard.usageClarificationNeeded;
  const incomplete = !requests.length || requests.some(r => !Number.isFinite(r.budget) || r.budget <= 0 || !r.main_usage);
  if (control || clarification || incomplete) return !output?.recommendations?.length
    && (control || !requests.length || output.clarification_needed === true)
    ? { valid: true, status: "non_recommendation_turn" }
    : { valid: false, status: "invalid_completion_context", error: "Clarify the current request before accepting products." };
  const previous = Object.entries(guard.previousRecommendationsByCategory || {}).map(([category, p]) =>
    ({ category, recommended_product: p.product, price: p.price }));
  return checkRecommendationCompletion(output, requests, catalogue, compatibility,
    { intent: guard.comparison === "another" ? "alternative" : guard.comparison || "none", previous });
}


function checkUsageRepairResponseContract(data, catalogue) {
  const exact = (value, keys) => value && typeof value === "object" && !Array.isArray(value)
    && Object.keys(value).length === keys.length && keys.every(key => Object.prototype.hasOwnProperty.call(value, key));
  if (!exact(data, ["answer", "recommendations", "next_step", "clarification_needed"])
    || typeof data.answer !== "string" || !data.answer.trim() || typeof data.next_step !== "string"
    || typeof data.clarification_needed !== "boolean" || !Array.isArray(data.recommendations)
    || (data.clarification_needed && data.recommendations.length)) return false;
