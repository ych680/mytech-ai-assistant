          else {
            const budgets = collectBudgetMatches(text);
            const raw = correction
              ? (correction[1] || "").trim().replace(/\s+instead$/i, "").trim()
              : testUsageClause(text, 0, text.length, { index: 0, end: 0 }, budgets);
            requirementFor(targets[0]).usage = raw;
          }
        }
      }
      const targets = sessionContext.targetCategories.length ? sessionContext.targetCategories : sessionContext.activeCategories;
      return testUsageOwnershipAmbiguous || targets.some(category =>
        !parseCatalogueUsage(requirementFor(category).usage, testUsageCatalogue, TEST_USAGE_POLICY, category).valid);
    }

    function updateSessionContext(text) {
      const categoryMatches = uniqueCategoryMatches(collectMatches(text, CATEGORY_MATCHERS));
      const usageMatches = collectMatches(text, USAGE_MATCHERS);
      const budgetMatches = collectBudgetMatches(text);
      const mentioned = categoryMatches.map((match) => match.value);
      const explicitReset = /^(?:(?:please\s+)?(?:start over|start again|restart|new conversation|new recommendation)\b|I'm not sure which device|I am not sure which device)/i.test(text.trim());
      const controlText = text.trim().toLowerCase().replace(/[.!?]+$/, "").replace(/\s+/g, " ");
      const cancellation = /^(?:never ?mind(?:[,;]?\s+(?:please )?cancel (?:that|the|this) comparison)?|(?:please )?cancel (?:(?:(?:that|the|this) )?(?:comparison|follow[- ]?up)|that|it)|(?:please )?stop (?:that|the|this) comparison)(?: please)?$/.test(controlText);
      // Bound the common control phrases, as in Phase1B.1: unrelated tasks and
      // negated clauses must not rewrite a pending comparison just by keyword.
      const categoryPattern = CATEGORY_MATCHERS.map((item) => item.pattern.replace(/^\\b|\\b$/g, "")).join("|");
      const comparisonPattern = new RegExp(
        "^(?:(?:please )?(?:(?:can|could|would) you (?:please )?)?(?:recommend|suggest|show|give)(?: me)? "
        + "|do you have |is there |are there |(?:can|could|may) i (?:get|have) )?"
        + "(?:a |an |any |anything |something )?"
        + "(cheaper|more affordable|less expensive|lower[- ]priced|more expensive|higher[- ]priced|alternative|another|different|other)"
        + "(?: (?:one|ones|option|options|product|products|(?:" + categoryPattern + ")"
        + "(?: (?:or|and) (?:" + categoryPattern + "))*(?: options?)?))?(?: please)?$"
      );
      const phrase = controlText.replace(/^(?:now|next)[,\s]+/, "").replace(/,\s*please$/, " please").match(comparisonPattern)?.[1];
      const comparison = cancellation || !phrase ? null
        : /^(?:cheaper|more affordable|less expensive|lower[- ]priced)$/.test(phrase) ? "cheaper"
        : /^(?:more expensive|higher[- ]priced)$/.test(phrase) ? "more_expensive" : "another";
      const hasDetails = budgetMatches.length > 0 || usageMatches.length > 0;
      const categoryOnly = mentioned.length === 1 && !hasDetails
        && new RegExp("^\\s*(?:the\\s+)?(?:" + CATEGORY_MATCHERS.find((item) => item.category === mentioned[0]).pattern.replace(/^\\b|\\b$/g, "") + ")(?: please)?[.!?]?\\s*$", "i").test(text);
      if (explicitReset) {
        clearSessionContext();
        modelHistory = [];
        rotateFastGptChatId();
      }
      if (cancellation) sessionContext.pendingComparison = null;
      // A complete new request supersedes a pending action; a category-only reply resumes it.
      if (mentioned.length && hasDetails && !comparison) sessionContext.pendingComparison = null;
      let intent = comparison || (categoryOnly ? sessionContext.pendingComparison : null);
      if (cancellation || explicitReset) intent = null;
      if (intent && mentioned.length === 0 && sessionContext.activeCategories.length > 1) {
        sessionContext.pendingComparison = intent;
        sessionContext.targetCategories = [];
      } else if (intent) {
        const targets = mentioned.length ? mentioned : [...sessionContext.activeCategories];
        sessionContext.targetCategories = targets;
        sessionContext.pendingComparison = targets.length === 1 ? null : intent;
      } else if (mentioned.length) {
        sessionContext.targetCategories = mentioned;
      }
      // Comparisons retain saved constraints. New details update their own category only.
      if (!cancellation) {
        sessionContext.activeCategories = [...new Set([...sessionContext.activeCategories, ...mentioned])];
        if (!intent || hasDetails) assignDetailsToCategories(text, categoryMatches, budgetMatches, usageMatches);
        if (!mentioned.length && !intent && !explicitReset) {
          for (const [kind, matches] of [["budget", budgetMatches]]) {
            const pending = sessionContext.activeCategories.filter((category) => !requirementFor(category)[kind]);
            const targets = pending.length === 1 ? pending
              : sessionContext.targetCategories.length === 1 ? sessionContext.targetCategories : [];
            if (matches.length === 1) targets.forEach((category) => {
              requirementFor(category)[kind] = kind === "budget" ? matches[0].amount : matches[0].value;
            });
          }
        }
      }
      const usageIssue = testUsageOwnershipIssue(text, mentioned, intent, explicitReset, cancellation);
      const budgetsByCategory = {};
      const usagesByCategory = {};
      sessionContext.activeCategories.forEach((category) => {
        const requirement = requirementFor(category);
        if (requirement.budget) budgetsByCategory[category] = requirement.budget;
        if (requirement.usage) usagesByCategory[category] = requirement.usage;
      });
      return {
        completionControl: completionControlMessage(text),
        demoUsageOwnershipAmbiguous: testUsageOwnershipAmbiguous,
        usageClarificationNeeded: usageIssue,
        startsNewFlow: explicitReset,
        activeCategories: [...sessionContext.activeCategories],
        targetCategories: [...sessionContext.targetCategories],
        ambiguousComparison: Boolean(intent && sessionContext.targetCategories.length !== 1),
        cancelled: cancellation,
        budgetsByCategory,
        usagesByCategory,
        previousRecommendationsByCategory: { ...sessionContext.lastRecommendationsByCategory },
        ambiguousBetter: /\bbetter\b/i.test(text) && !/\b(?:better\s+(?:screen|display|battery|camera|performance|value|comfort|sound|microphone|portability)|better\s+for)\b/i.test(text),
        comparison: intent
      };
    }

    function isPlainObject(value) {
      return Boolean(value) && typeof value === "object" && !Array.isArray(value);
    }

    function hasExactKeys(object, requiredKeys, allowedKeys, label, errors) {
      const keys = Object.keys(object);
      requiredKeys.forEach((key) => {
        if (!keys.includes(key)) errors.push(`${label} is missing ${key}.`);
      });
      keys.forEach((key) => {
        if (!allowedKeys.includes(key)) errors.push(`${label} contains unsupported field ${key}.`);
      });
    }

    function usageIsCompatible(product, requestedUsage) {
      return checkCatalogueUsage(product, requestedUsage, testUsageCatalogue, TEST_USAGE_POLICY).valid;
    }

    function validateStructuredOutput(output, guard) {
      const errors = [];
      if (!isPlainObject(output)) {
        return { valid: false, errors: ["The model output is not a JSON object."] };
      }

      const requiredTopLevel = ["answer", "recommendations", "next_step", "clarification_needed"];
      hasExactKeys(output, requiredTopLevel, requiredTopLevel, "Response", errors);

      if (typeof output.answer !== "string" || !output.answer.trim()) errors.push("answer must be a non-empty string.");
      if (!Array.isArray(output.recommendations)) errors.push("recommendations must be an array.");
      if (typeof output.next_step !== "string") errors.push("next_step must be a string.");
      if (typeof output.clarification_needed !== "boolean") errors.push("clarification_needed must be a boolean.");

      const recommendations = Array.isArray(output.recommendations) ? output.recommendations : [];
      if ((guard.ambiguousComparison || guard.cancelled || output.clarification_needed) && recommendations.length) {
        errors.push("Clarification or cancellation must not contain product recommendations.");
      }
      const seenCategories = new Set();
      if (guard.ambiguousBetter && recommendations.length) {
        errors.push("An ambiguous 'better' request must ask for clarification without a recommendation.");
      }

      recommendations.forEach((recommendation, index) => {
        const label = `Recommendation ${index + 1}`;
        if (!isPlainObject(recommendation)) {
          errors.push(`${label} must be an object.`);
          return;
        }

        if (seenCategories.has(recommendation.category)) errors.push("Duplicate recommendation category.");
        seenCategories.add(recommendation.category);
        if (!guard.activeCategories.includes(recommendation.category)) errors.push("Recommendation has no active request.");
        if (guard.comparison && !guard.targetCategories.includes(recommendation.category)) errors.push("Recommendation is outside the comparison target.");
        const required = ["category", "recommended_product", "price", "reason", "source"];
        const allowed = [...required, "source"];
        hasExactKeys(recommendation, required, allowed, label, errors);

        if (!IDENTITY.supportedCategories.includes(recommendation.category)) {
          errors.push(`${label} has an unsupported category.`);
        }
        if (typeof recommendation.recommended_product !== "string") {
          errors.push(`${label} has an invalid product name.`);
          return;
        }

        const product = productByName.get(recommendation.recommended_product);
        if (!product) {
          errors.push(`${label} is not in the approved dataset.`);
          return;
        }
        if (recommendation.category !== product.category) errors.push(`${label} category does not match the dataset.`);
        if (typeof recommendation.price !== "number" || recommendation.price !== product.price_rmb) {
          errors.push(`${label} price does not match the dataset.`);
        }
        if (typeof recommendation.reason !== "string" || !recommendation.reason.trim()) {
          errors.push(`${label} reason must be a non-empty string.`);
        }
        if (Object.prototype.hasOwnProperty.call(recommendation, "source")
          && (typeof recommendation.source !== "string" || recommendation.source !== product.source)) {
          errors.push(`${label} source does not match the dataset.`);
        }

        const hardBudget = guard.budgetsByCategory[product.category];
        if (!Number.isFinite(hardBudget) || hardBudget <= 0 || product.price_rmb > hardBudget) {
          errors.push(`${label} exceeds the active hard budget of ${formatPrice(hardBudget)}.`);
        }

        const requestedUsage = guard.usagesByCategory[product.category];
        if (!requestedUsage || !usageIsCompatible(product, requestedUsage)) {
          errors.push(`${label} does not match the dataset usage tags for ${requestedUsage}.`);
        }

        const previous = guard.previousRecommendationsByCategory[product.category];
        if (guard.comparison && !previous) errors.push(`${label} has no validated comparison anchor.`);
        if (previous && guard.comparison === "another" && product.product === previous.product) {
          errors.push(`${label} repeats the previous product instead of giving another option.`);
        }
        if (previous && guard.comparison === "cheaper" && product.price_rmb >= previous.price) {
          errors.push(`${label} is not cheaper than the previous recommendation.`);
        }
        if (previous && guard.comparison === "more_expensive" && product.price_rmb <= previous.price) {
          errors.push(`${label} is not more expensive than the previous recommendation.`);
        }
      });

      if (guard.usageClarificationNeeded && recommendations.length) errors.push("Please clarify usage ownership.");
      const completion = checkClientRecommendationCompletion(output, guard, testUsageCatalogue, TEST_USAGE_POLICY);
      if (!completion.valid) errors.push(completion.error);

      const visibleText = [
        typeof output.answer === "string" ? output.answer : "",
        typeof output.next_step === "string" ? output.next_step : "",
        ...recommendations.map((item) => typeof item?.reason === "string" ? item.reason : "")
      ].join(" ");
      if (/\b(?:live (?:price|pricing|availability)|currently in stock|available right now)\b/i.test(visibleText)) {
        errors.push("The response makes an unsupported live price or availability claim.");
      }

      return { valid: errors.length === 0, errors, output: completion.output || output };
    }

    function coerceStructuredOutput(result) {
      const text = result?.choices?.[0]?.message?.content;
      if (typeof text !== "string" || !text.trim()) throw new Error("EMPTY_MODEL_OUTPUT");
      const whole = text.trim();
      const fenced = /^\x60\x60\x60json\r?\n([\s\S]*?)\r?\n\x60\x60\x60$/.exec(whole);
      let output;
      try { output = JSON.parse(fenced ? fenced[1] : whole); }
      catch { throw new Error("MODEL_OUTPUT_NOT_JSON"); }
      if (isPlainObject(output) && Array.isArray(output.recommendations)) {
        output.recommendations = output.recommendations.map((item) => {
          if (!isPlainObject(item)) return item;
          const normalised = { ...item };
          if (normalised.source === null) delete normalised.source;
          return normalised;
        });
      }
      return output;
    }

    async function callModel(payload, signal) {
      if (!testConnectionAvailable()) throw new Error("KEY_REQUIRED");
      if (!/^[A-Za-z0-9][A-Za-z0-9_-]{7,127}$/.test(payload.chatId)) throw new Error("INVALID_CHAT_ID");
      const response = await fetch(endpoint("/fastgpt/v1/chat/completions"), {
        method: "POST",
        headers: headers(),
        body: JSON.stringify(LOCAL_TEST ? payload : {
          chatId: payload.chatId, // Proxy pass-through and persistence require live verification.
          stream: false,
          max_tokens: CONFIG.maxTokens,
          messages: [{ role: "user", content: payload.message }]
        }),
        signal
      });
      const body = await response.json().catch(() => null);
      if (!response.ok) {
        const error = new Error("MODEL_HTTP_ERROR");
        error.status = response.status;
        throw error; // Never surface upstream body/error messages or credentials.
      }
      if (body?.choices?.[0]?.finish_reason === "length") throw new Error("MODEL_OUTPUT_NOT_JSON");
      return body;
    }

    function serializableContext() {
      return {
        activeRequests: sessionContext.activeCategories.map((category) => ({
          ...requirementFor(category),
          lastRecommendation: sessionContext.lastRecommendationsByCategory[category]?.product || null
        }))
      };
    }

    async function requestValidatedModel(message, guard, signal) {
      const rawResult = await callModel({
        message,
        chatId: fastGptChatId,
        context: serializableContext(),
        budgetConstraints: guard.budgetsByCategory,
        usageConstraints: guard.usagesByCategory,
        validationContext: guard
      }, signal);

      const output = coerceStructuredOutput(rawResult);
      if ((guard.usageClarificationNeeded || demoHasMissingInformation(guard))
        && !demoMissingFieldClarification(output, guard)) {
        throw new Error(guard.usageClarificationNeeded ? "USAGE_CLARIFICATION_REQUIRED" : "MODEL_OUTPUT_VALIDATION_FAILED");
      }
      const display = testDisplayOutput(output);
      const validation = validateStructuredOutput(output, guard);
      if (validation.valid && validateStructuredOutput(display, guard).valid) return validation.output;

      const error = new Error("MODEL_OUTPUT_VALIDATION_FAILED");
      error.code = "MODEL_OUTPUT_VALIDATION_FAILED";
      error.validationErrors = validation.errors;
      throw error;
    }

    function updateContextAfterResponse(response) {
      response.recommendations.forEach((recommendation) => {
        sessionContext.lastRecommendationsByCategory[recommendation.category] = {
          product: recommendation.recommended_product,
          price: recommendation.price
        };
      });
    }

    function safeErrorResponse(error) {
      const status = error.status;
      let message;
      if (status === 401) message = HOSTED ? "Please reload the page and sign in again." : "That key was not accepted. Check your FastGPT application key.";
      else if (status === 402) message = "This month's budget is used up. Ask your teacher.";
      else if (status === 403) message = HOSTED ? "This chatbot is paused right now." : "This key cannot use that feature.";
      else if (status === 429) message = "Too many messages at once. Wait a few seconds and try again.";
      else if (status >= 500) message = "The AI service is busy. Try again in a moment.";
      else if (error.message === "KEY_REQUIRED") message = "Enter your own FastGPT application key to continue.";
      else if (error.message === "MODEL_TIMEOUT") message = "The FastGPT request timed out. Please try again.";
      else if (error.message === "USAGE_CLARIFICATION_REQUIRED") message = "Please clarify which intended usage belongs to each product; no recommendation was accepted.";
      else if (["MODEL_OUTPUT_VALIDATION_FAILED", "MODEL_OUTPUT_NOT_JSON", "EMPTY_MODEL_OUTPUT"].includes(error.message)) {
        return { paragraphs: ["I couldn't safely validate the model response, so I did not show any product recommendation.", "Please try the request again or restate the category, maximum budget, and main usage."] };
      } else message = "Cannot reach the AI service. Check your internet connection.";
      return { paragraphs: [message] };
    }

    async function sendMessage() {
      const text = inputElement.value.trim().slice(0, 8000);
      if (!text || isGenerating || !datasetReady || (!testConnectionAvailable())) return;

      invalidateRecovery();
      demoInvalidateFollowup();
      addUserMessage(text);
      inputElement.value = "";
      autoResizeInput();

      const guard = updateSessionContext(text);
      const currentRequest = ++requestVersion;
      activeAbortController = new AbortController();
      const turnController = activeAbortController;
      let timedOut = false;
      const startedAt = testNow();
      let timingStatus = "rejected";
      const timeout = window.setTimeout(() => { timedOut = true; turnController.abort(); }, testDeadlineMs());
      setGenerating(true);
      const thinkingMessage = addThinkingMessage();
      const thinkingDelay = delay(CONFIG.minimumThinkingTimeMs);

      try {
        const response = await requestValidatedModel(text, guard, turnController.signal);
        if (timedOut) throw new Error("MODEL_TIMEOUT");
        await thinkingDelay;
        if (currentRequest !== requestVersion) return;

        thinkingMessage.remove();
        addStructuredResponse(testDisplayOutput(response));
        updateContextAfterResponse(response);
        demoShowFollowup(response, guard, currentRequest);
        timingStatus = "validated";
        modelConnectionReady = true;
        modelHistory.push(
          { role: "user", content: text },
          { role: "assistant", content: JSON.stringify(response) }
        );
        if (modelHistory.length > CONFIG.maximumHistoryMessages) {
          modelHistory = modelHistory.slice(-CONFIG.maximumHistoryMessages);
        }
      } catch (error) {
        await thinkingDelay;
        if (currentRequest !== requestVersion) return;
        if (timedOut) error = new Error("MODEL_TIMEOUT");
        thinkingMessage.remove();
        const bubble = addTextResponse(safeErrorResponse(error));
        createRecoveryAction(bubble, text, currentRequest);
      } finally {
        window.clearTimeout(timeout);
        emitTestTiming("turn", startedAt, timedOut ? "timeout" : currentRequest !== requestVersion ? "cancelled" : timingStatus);
        if (currentRequest === requestVersion) {
          activeAbortController = null;
          setGenerating(false);
          inputElement.focus({ preventScroll: true });
        }
      }
    }

    function resetConversation() {
      invalidateRecovery();
      demoInvalidateFollowup();
      testUsageOwnershipAmbiguous = false;
      requestVersion += 1;
      if (activeAbortController) {
        activeAbortController.abort();
        activeAbortController = null;
      }

      modelHistory = [];
      rotateFastGptChatId();
      clearSessionContext();
      setGenerating(false);
      messagesElement.replaceChildren();
      inputElement.value = "";
      autoResizeInput();

      addTextResponse({
        paragraphs: [
          "Hi! I'm MyTech. I can help you choose laptops, desktops, smartphones, tablets, headphones, monitors, smartwatches, mice, and keyboards. Tell me what you need, your budget in RMB, and your main usage."
        ]
      });

      demoResetExamples();
      if (datasetReady) inputElement.focus({ preventScroll: true });
    }

    function validateProductDataset(dataset) {
      const nonempty = value => typeof value === "string" && value.trim().length > 0;
      const strings = value => Array.isArray(value) && value.length > 0 && value.every(nonempty);
      if (!isPlainObject(dataset) || !Array.isArray(dataset.products)
        || dataset.dataset_name !== TEST_CATALOGUE_CONTRACT.dataset_name
        || dataset.version !== "2.1-TEST" || dataset.currency !== "RMB"
        || dataset.products.length !== TEST_CATALOGUE_CONTRACT.count
        || !nonempty(dataset.snapshot_date) || !nonempty(dataset.price_note)
        || !dataset.price_note.includes("TEST")) throw new Error("INVALID_TEST_PRODUCT_DATASET");
      if (JSON.stringify(dataset.supported_categories) !== JSON.stringify(IDENTITY.supportedCategories)) {
        throw new Error("INVALID_SUPPORTED_CATEGORIES");
      }
      const prefixes = ["LAP", "DES", "PHO", "TAB", "AUD", "MON", "WAT", "MOU", "KEY"];
      const ids = new Set(), names = new Set();
      dataset.products.forEach(product => {
        if (!isPlainObject(product)) throw new Error("INVALID_PRODUCT_DATASET_ENTRY");
        const prefix = prefixes[IDENTITY.supportedCategories.indexOf(product.category)];
        const valid = ["id", "category", "product", "tier", "source", "review_status", "evidence_url", "price_evidence"]
          .every(key => nonempty(product[key]) && product[key] === product[key].trim())
          && IDENTITY.supportedCategories.includes(product.category)
          && new RegExp("^" + prefix + "-[0-9]{3,9}$").test(product.id)
          && Number(product.id.split("-")[1]) > 0
          && Number.isSafeInteger(product.price_rmb) && product.price_rmb > 0
          && ["Entry", "Mid-range", "Premium"].includes(product.tier)
          && ["EXISTING BASELINE", "NEW CANDIDATE — provisional", "NEW CANDIDATE — unverified"].includes(product.review_status)
          && strings(product.main_usage) && strings(product.key_features);
        const name = String(product.product).toLowerCase();
        if (!valid || ids.has(product.id) || names.has(name)) throw new Error("INVALID_PRODUCT_DATASET_ENTRY");
        ids.add(product.id);
        names.add(name);
      });
    }

    async function loadApplicationData() {
      const dataset = JSON.parse(document.getElementById("mytech-dataset").textContent);
      const promptText = JSON.parse(document.getElementById("mytech-reference-prompt").textContent);
      validateProductDataset(dataset);
      if (typeof promptText !== "string" || !promptText.trim().startsWith("You are MyTech")) throw new Error("INVALID_SYSTEM_PROMPT");
      productDataset = dataset;
      systemPrompt = promptText.trim(); // Reference only; the published FastGPT app owns its prompts.
      productByName = new Map(dataset.products.map((product) => [product.product, product]));
      testUsageCatalogue = Object.fromEntries(dataset.products.map(product => [product.id, product]));
      datasetReady = true;
    }

    function readRememberedKey() {
      if (HOSTED || !PRIVATE) return "";
      try { return storage()?.getItem(KEY_STORE) || ""; } catch { return ""; }
    }

    function rememberKey(remember) {
      if (HOSTED || !PRIVATE) return true;
      try {
        const store = storage();
        if (!store) return false;
        if (remember && apiKey) store.setItem(KEY_STORE, apiKey);
        else store.removeItem(KEY_STORE);
        return true;
      } catch { return false; }
    }

    function setKey(value, remember) {
      if (HOSTED) return;
      const next = value.trim();
      const changed = next !== apiKey;
      apiKey = next;
      const stored = rememberKey(remember);
      document.getElementById("key").value = "";
      document.getElementById("key").placeholder = apiKey ? "Key set" : "Your FastGPT application key";
      if (changed) {
        modelConnectionReady = false;
        resetConversation();
      }
      setControlsDisabled(isGenerating || !datasetReady || !apiKey);
      restoreConnectionStatus();
      return stored;
    }

    function initializeKeyPanel() {
      if (HOSTED) return;
      document.getElementById("key-panel").hidden = false;
      document.getElementById("remember-row").hidden = !PRIVATE;
      const saved = readRememberedKey();
      // A TokenProxy key must never silently replace the MyTech FastGPT workflow.
      const valid = saved.startsWith("openapi-") && saved.length > 8 ? saved : "";
      document.getElementById("remember").checked = Boolean(valid);
      setKey(valid, Boolean(valid));
      document.getElementById("key-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const value = document.getElementById("key").value.trim();
        if (!value.startsWith("openapi-") || value.length <= 8) {
          document.getElementById("key").value = "";
          document.getElementById("key-status").textContent = "Use a FastGPT application key for MyTech; a classroom model key cannot run this workflow.";
          return;
        }
        const stored = setKey(value, document.getElementById("remember").checked);
        document.getElementById("key-status").textContent = stored
          ? "Key set. It is sent only to the school's FastGPT service."
          : "Key set for this session. Browser storage could not be updated; a previously saved key may remain.";
      });
      document.getElementById("remember").addEventListener("change", () => {
        if (!rememberKey(document.getElementById("remember").checked)) {
          document.getElementById("key-status").textContent = "Browser storage could not be updated; a previously saved key may remain.";
        }
      });
      document.getElementById("forget").addEventListener("click", () => {
        const stored = setKey("", false);
        document.getElementById("remember").checked = false;
        document.getElementById("key-status").textContent = stored
          ? "Key forgotten." : "Key cleared for this session. Browser storage could not be cleared.";
      });
    }

    async function initialize() {
      setControlsDisabled(true);
      resetConversation();
      setStatus("ready", "Loading reference data...");
      try {
        await loadApplicationData();
        await configureLocalTest();
        initializeKeyPanel();
        setControlsDisabled(!testConnectionAvailable());
        restoreConnectionStatus();
      } catch {
        datasetReady = false;
        setControlsDisabled(true);
        restoreConnectionStatus();
        addTextResponse({ paragraphs: ["MyTech could not load its approved reference data and has disabled recommendations."] });
      }
    }

    const DEMO_PROMPTS = {"starters":[{"label":"Gaming Setup \u00d72","prompt":"I need a laptop under \u00a56,000 for gaming and a mouse under \u00a5300 for gaming."},{"label":"Study Laptop","prompt":"I need a laptop under \u00a57,000 for study and office work."},{"label":"ANC Headphones","prompt":"I need headphones under \u00a51,200 for music, commuting, and noise cancellation."},{"label":"Gaming Smartphone","prompt":"I need a smartphone under \u00a53,000 for gaming."}],"examples":[{"label":"Clarification","prompt":"I need a laptop."},{"label":"Honest No-Match","prompt":"I need headphones under \u00a5800 for music, commuting, and noise cancellation."}],"actions":[{"label":"Cheaper","phrase":"a cheaper"},{"label":"More Expensive","phrase":"a more expensive"},{"label":"Another Option","phrase":"another"}]};
    // UI state is separate from FastGPT memory and the four-field public contract.
    let demoFollowup = null;
    let demoExampleButtons = [];

    function demoInvalidateFollowup() {
      if (!demoFollowup) return;
      demoFollowup.buttons.forEach(button => { button.disabled = true; });
      if (demoFollowup.select) demoFollowup.select.disabled = true;
      demoFollowup.root.remove();
      demoFollowup = null;
    }

    function demoContextMatches(entry) {
      const requirement = sessionContext.requirementsByCategory[entry.category];
      const anchor = sessionContext.lastRecommendationsByCategory[entry.category];
      const product = productByName.get(entry.product);
      return requirement && anchor && product && product.category === entry.category
        && requirement.budget === entry.budget && requirement.usage === entry.usage
        && anchor.product === entry.product && anchor.price === entry.price
        && product.price_rmb === entry.price && entry.price <= entry.budget
        && Number.isFinite(entry.budget) && entry.budget > 0
        && usageIsCompatible(product, entry.usage);
    }

    function demoRefreshControls() {
      const unavailable = isGenerating || !datasetReady || !testConnectionAvailable();
      demoExampleButtons.forEach(button => { button.disabled = unavailable; });
      const state = demoFollowup;
      if (!state) return;
      // Even retained DOM references cannot act on an earlier turn or chat.
      const valid = state.version === requestVersion && state.chatId === fastGptChatId
        && state.entries.every(demoContextMatches);
      if (!valid) { demoInvalidateFollowup(); return; }
      const blocked = unavailable || inputElement.value.length > 0;
      if (state.select) state.select.disabled = blocked;
      state.buttons.forEach(button => { button.disabled = blocked || !state.category; });
    }

    function demoShowFollowup(response, guard, version) {
      demoInvalidateFollowup();
      if (!response.recommendations.length || response.clarification_needed
        || guard.completionControl || guard.cancelled || guard.ambiguousComparison
        || guard.ambiguousBetter || guard.usageClarificationNeeded || version !== requestVersion) return;
      const entries = response.recommendations.map(item => Object.freeze({
        category: item.category, product: item.recommended_product, price: item.price,
        budget: guard.budgetsByCategory[item.category], usage: guard.usagesByCategory[item.category]
      }));
      if (!entries.every(demoContextMatches)) return;
      const root = document.createElement("section");
      root.className = "demo-followup";
      root.setAttribute("aria-label", "Recommendation follow-up");
      const state = { root, entries: Object.freeze(entries), version, chatId: fastGptChatId,
        category: entries.length === 1 ? entries[0].category : "", select: null, buttons: [] };
      demoFollowup = state;
      const context = document.createElement("p");
      context.setAttribute("aria-live", "polite");
      const describe = () => {
        const entry = entries.find(item => item.category === state.category);
        context.textContent = entry
          ? `${entry.category} · ${entry.product} · Maximum ${formatPrice(entry.budget)}`
          : "Choose a recommended category to compare. Your saved maximum budget and usage stay the same.";
      };
      if (entries.length > 1) {
        const label = document.createElement("label");
        label.className = "demo-category";
        label.textContent = "Category to compare";
        const select = document.createElement("select");
        select.setAttribute("aria-label", "Category to compare");
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Choose a category…";
        select.appendChild(placeholder);
        entries.forEach(entry => {
          const option = document.createElement("option");
          option.value = entry.category;
          option.textContent = entry.category;
          select.appendChild(option);
        });
        select.value = "";
        select.addEventListener("change", () => {
          if (demoFollowup !== state || select.disabled) return;
          state.category = entries.some(entry => entry.category === select.value) ? select.value : "";
          describe();
          demoRefreshControls();
        });
        state.select = select;
        label.appendChild(select);
        root.appendChild(label);
      }
      describe();
      root.appendChild(context);
      const actions = document.createElement("div");
      actions.className = "demo-actions";
      DEMO_PROMPTS.actions.forEach(action => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "recovery-button";
        button.textContent = action.label;
        button.addEventListener("click", () => {
          demoRefreshControls();
          if (demoFollowup !== state || button.disabled || !state.category) return;
          inputElement.value = `Can you recommend ${action.phrase} ${state.category.toLowerCase()}?`;
          autoResizeInput();
          sendMessage();
        });
        state.buttons.push(button);
        actions.appendChild(button);
      });
      root.appendChild(actions);
      messagesElement.appendChild(root);
      demoRefreshControls();
      scrollToNewest();
    }

    function demoResetExamples() {
      // Restart destroys the old details/buttons; retained references are inert.
      demoExampleButtons.forEach(button => { button.disabled = true; });
      demoExampleButtons = [];
      const details = document.createElement("details");
      details.className = "demo-examples";
      const summary = document.createElement("summary");
      summary.textContent = "More Examples";
      const note = document.createElement("p");
      note.textContent = "Clarification is a fresh-conversation example. Use Restart first if you have already supplied Laptop requirements. Examples keep the current conversation.";
      const actions = document.createElement("div");
      actions.className = "demo-actions";
      DEMO_PROMPTS.examples.forEach(example => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "recovery-button";
        button.textContent = example.label;
        button.title = example.prompt;
        button.addEventListener("click", () => {
          if (!demoExampleButtons.includes(button) || button.disabled || isGenerating
            || !datasetReady || !testConnectionAvailable() || inputElement.value.length > 0) return;
          inputElement.value = example.prompt;
          autoResizeInput();
          sendMessage();
        });
        demoExampleButtons.push(button);
        actions.appendChild(button);
      });
      details.append(summary, note, actions);
      messagesElement.appendChild(details);
      demoRefreshControls();
    }

    function demoHasMissingInformation(guard) {
      if (guard.completionControl || guard.cancelled || guard.comparison
        || guard.ambiguousComparison || guard.ambiguousBetter) return false;
      const targets = guard.targetCategories.length ? guard.targetCategories : guard.activeCategories;
      return targets.some(category => guard.budgetsByCategory[category] === undefined
        || !guard.usagesByCategory[category]);
    }

    function demoMissingFieldClarification(output, guard) {
      // This bounded exception accepts complete clarification clauses, never
      // keyword fragments. Original response/display validators still run next.
      if (!isPlainObject(output) || output.clarification_needed !== true
        || !Array.isArray(output.recommendations) || output.recommendations.length
        || typeof output.answer !== "string" || typeof output.next_step !== "string"
        || guard.demoUsageOwnershipAmbiguous || guard.completionControl || guard.cancelled
        || guard.comparison || guard.ambiguousComparison || guard.ambiguousBetter) return false;
      const targets = guard.targetCategories.length ? guard.targetCategories : guard.activeCategories;
      // Category-free questions and pronouns are unambiguous only for one target.
      // Multi-target clarification prose remains outside this narrow exception.
      if (targets.length !== 1 || !IDENTITY.supportedCategories.includes(targets[0])) return false;
      const category = targets[0], noun = category.toLowerCase();
      const missing = new Set();
      const budget = guard.budgetsByCategory[category], usage = guard.usagesByCategory[category];
      if (budget === undefined) missing.add("budget");
      else if (!Number.isFinite(budget) || budget <= 0) return false;
      if (!usage) missing.add("usage");
      else if (!parseCatalogueUsage(usage, testUsageCatalogue, TEST_USAGE_POLICY, category).valid) return false;
      if (!missing.size) return false;

      const device = "(?:the |your )?" + noun;
      const budgetTerm = new RegExp("^(?:(?:your|the) )?(?:maximum )?budget(?: for " + device + ")?(?: in (?:rmb|cny|yuan))?$");
      const usageTerm = new RegExp("^(?:(?:your|the) )?(?:(?:main|intended) )?(?:usage|use|purpose)(?: for " + device + ")?$");
      const parseTerms = value => {
        const terms = value.split(/,? and /);
        if (!terms.length || terms.length > 2) return null;
        const fields = terms.map(term => budgetTerm.test(term) ? "budget" : usageTerm.test(term) ? "usage" : null);
        return fields.every(Boolean) && new Set(fields).size === fields.length ? fields : null;
      };
      const usageQuestion = new RegExp("^what (?:will|do) you (?:mainly )?use (?:" + device + "|it) for$");
      const budgetQuestion = new RegExp("^how much (?:can|would) you (?:spend|like to spend)(?: on " + device + ")?$");
      const parseQuestion = clause => {
        const simple = /^(?:what (?:is|are)|(?:could|can) you (?:tell me|provide|specify|share)) (.+)$/.exec(clause);
        if (simple) return parseTerms(simple[1]);
        if (usageQuestion.test(clause)) return ["usage"];
        if (budgetQuestion.test(clause)) return ["budget"];
        return null;
      };
      const neutral = new Set(["sure", "okay", "thanks", "got it"]);
      const offer = new RegExp("^i can help you choose (?:a |an |the |your )?" + noun + "$");
      const asked = new Set();
      let count = 0;
      for (const field of [output.answer, output.next_step]) {
        const text = field.trim().toLowerCase().replace(/\s+/g, " ");
        if (!text) continue;
        const sentences = text.match(/[^.!?]+(?:[.!?]|$)/g);
        if (!sentences || sentences.join("") !== text) return false;
        for (const sentence of sentences) {
          if (++count > 8) return false;
          const ending = /[.!?]$/.exec(sentence)?.[0] || "";
          const clause = sentence.replace(/[.!?]$/, "").trim();
          if ((neutral.has(clause) || offer.test(clause)) && ending !== "?") continue;
          const directive = /^(?:please )?(?:tell me|provide|specify|share|state) (.+)$/.exec(clause);
          let fields;
          if (directive) fields = parseTerms(directive[1]);
          else {
            if (ending !== "?") return false;
            // A bounded pair of actual questions, e.g. budget + intended use.
            const questions = clause.split(/,? and (?=what |how )/);
            if (questions.length > 2) return false;
            const parsed = questions.map(parseQuestion);
            fields = parsed.every(Boolean) ? parsed.flat() : null;
          }
          if (!fields || fields.some(name => !missing.has(name))) return false;
          fields.forEach(name => asked.add(name));
        }
      }
      return [...missing].every(name => asked.has(name));
    }

    inputElement.addEventListener("input", () => {
      autoResizeInput();
      refreshRecoveryAvailability();
      demoRefreshControls();
    });
    inputElement.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        sendMessage();
      }
    });

    sendButton.addEventListener("click", sendMessage);
    restartButton.addEventListener("click", resetConversation);
    promptButtons.forEach((button) => {
      button.addEventListener("click", () => {
        if (isGenerating || !datasetReady || (!testConnectionAvailable())) return;
        inputElement.value = button.dataset.prompt;
        autoResizeInput();
        sendMessage();
      });
    });

    initialize();
  </script>
</body>
</html>
